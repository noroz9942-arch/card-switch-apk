name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
  runs-on: ubuntu-22.04

  steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Build with Buildozer
    uses: kivy/buildozer-action@v1
    with:
      filename: buildozer.spec
      command: android debug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: card-switch-apk
      path: bin/*.apk
